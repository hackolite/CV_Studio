name: Build Windows Executable
on:
 workflow_dispatch:  # Allows manual triggering from GitHub Actions tab
 push:
   tags:
     - 'v*'  # Triggers on version tags like v1.0.0
 release:
   types: [created]
jobs:
 build-windows-exe:
   runs-on: windows-latest
  
   env:
     PYTHONUTF8: '1'
     PYTHONIOENCODING: 'utf-8'
  
   permissions:
     contents: write  # Required for uploading release assets
     actions: read    # Required for downloading artifacts
  
   steps:
   - name: Checkout repository
     uses: actions/checkout@v4
    
   - name: Set up Python
     uses: actions/setup-python@v5
     with:
       python-version: '3.10'
      
   - name: Install build tools
     run: |
       python -m pip install --upgrade pip setuptools wheel
       pip install Cython numpy
      
   - name: Install dependencies
     run: |
       pip install -r requirements.txt
       pip install pyinstaller
      
   - name: Build executable with PyInstaller
     run: |
       python build_exe.py --clean
      
   - name: Verify build
     run: |
       if (Test-Path "dist/CV_Studio/CV_Studio.exe") {
         Write-Host "✓ CV_Studio.exe created successfully"
         Get-ChildItem dist/CV_Studio -Recurse | Measure-Object -Property Length -Sum | Select-Object @{Name="Size(MB)";Expression={[math]::Round($_.Sum / 1MB, 2)}}
       } else {
         Write-Error "Build failed - CV_Studio.exe not found"
         exit 1
       }
      
   - name: Create archive
     run: |
       Compress-Archive -Path dist/CV_Studio -DestinationPath CV_Studio-Windows.zip
      
   - name: Upload artifact
     uses: actions/upload-artifact@v4
     with:
       name: CV_Studio-Windows-Executable
       path: CV_Studio-Windows.zip
       retention-days: 30
      
   - name: Upload to release (if triggered by release)
     if: github.event_name == 'release'
     uses: actions/upload-release-asset@v1
     env:
       GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
     with:
       upload_url: ${{ github.event.release.upload_url }}
       asset_path: ./CV_Studio-Windows.zip
       asset_name: CV_Studio-Windows.zip
       asset_content_type: application/zip
