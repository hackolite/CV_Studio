name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types: [created]

jobs:
  build-windows-exe:
    runs-on: windows-latest

    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'

    permissions:
      contents: write
      actions: read

    steps:
    # 1️⃣ Récupération du code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Setup Python 3.10
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3️⃣ Installer outils de build
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip setuptools wheel

    # 4️⃣ Installer les dépendances de build d'abord
    - name: Install build dependencies first
      run: |
        pip install numpy>=1.21.0 Cython>=0.29.36
    
    # 5️⃣ Installer toutes les dépendances
    - name: Install dependencies
      run: |
        pip install --no-build-isolation -r requirements.txt
        pip install pyinstaller

    # 6️⃣ Nettoyer d'anciens builds pour éviter les conflits
    - name: Clean previous builds
      run: |
        Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue

    # 7️⃣ Build l’exécutable avec PyInstaller
    - name: Build executable with PyInstaller
      run: |
        python build_exe.py --clean

    # 8️⃣ Vérifier le build et afficher les tailles
    - name: Verify build
      run: |
        if (Test-Path "dist/CV_Studio/CV_Studio.exe") {
          Write-Host "✓ CV_Studio.exe created successfully"
          $exeSize = (Get-Item "dist/CV_Studio/CV_Studio.exe").Length
          Write-Host ("Executable size: {0:N2} MB" -f ($exeSize / 1MB))
          $totalSize = (Get-ChildItem dist/CV_Studio -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Total folder size: {0:N2} MB" -f ($totalSize / 1MB))
          Write-Host ("Total files: {0}" -f (Get-ChildItem dist/CV_Studio -Recurse -File).Count)
        } else {
          Write-Error "Build failed - CV_Studio.exe not found"
          exit 1
        }

    # 9️⃣ Créer l’archive zip
    - name: Create archive
      run: |
        Compress-Archive -Path dist/CV_Studio -DestinationPath CV_Studio-Windows.zip

    # 🔟 Upload de l’artefact pour le workflow
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: CV_Studio-Windows-Executable
        path: CV_Studio-Windows.zip
        retention-days: 30

    # 1️⃣1️⃣ Upload sur la release si trigger par release
    - name: Upload to release (if triggered by release)
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: CV_Studio-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
